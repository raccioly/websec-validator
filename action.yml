name: "websec-validator"
# Marketplace requires < 125 chars
description: "Local-first security recon that briefs your AI coding agent — SARIF for Code Scanning, can gate PRs on new findings."
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: "Path to the repo/subdir to scan."
    required: false
    default: "."
  scan:
    description: "Also execute the available static scanners (Trivy/Gitleaks/Semgrep/…) if present."
    required: false
    default: "false"
  fail-on:
    description: "Gate findings at this severity (critical|high|medium|low). Empty disables the severity gate; require-complete still applies."
    required: false
    default: ""
  baseline:
    description: "Optional prior findings-ledger.json — gate only on findings NEW since this baseline."
    required: false
    default: ""
  upload-sarif:
    description: "Upload results.sarif to the GitHub Security tab (Code Scanning)."
    required: false
    default: "true"
  out:
    description: "Output directory."
    required: false
    default: "websec-out"
  require-complete:
    description: "Fail incomplete requested checks even in report-only mode."
    default: "true"
  scanners:
    description: "Comma-separated explicitly required scanners; requires scan=true."
    default: ""

outputs:
  run-directory:
    description: "Exact current attempt, including incomplete attempts."
    value: ${{ steps.scan.outputs.run_directory }}
  sarif-file:
    description: "SARIF from this attempt; never a prior latest run."
    value: ${{ steps.scan.outputs.sarif_file }}
  execution-complete:
    description: "Whether requested execution completed."
    value: ${{ steps.scan.outputs.execution_complete }}
  exit-code:
    description: "Exact `websec run` exit code: 0 clean, 1 gating findings (fail-on/baseline), 2 usage or configuration error, 3 incomplete execution. Empty if the run's artifacts could not be selected."
    value: ${{ steps.scan.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Install websec-validator
      shell: bash
      env:
        WEBSEC_ACTION_PATH: ${{ github.action_path }}
      run: python -I -m pip install --disable-pip-version-check "$WEBSEC_ACTION_PATH"

    - name: Run websec-validator
      id: scan
      shell: bash
      env:
        WEBSEC_ACTION_PATH: ${{ github.action_path }}
        WEBSEC_INPUT_PATH: ${{ inputs.path }}
        WEBSEC_INPUT_OUT: ${{ inputs.out }}
        WEBSEC_INPUT_SCAN: ${{ inputs.scan }}
        WEBSEC_INPUT_FAIL_ON: ${{ inputs.fail-on }}
        WEBSEC_INPUT_BASELINE: ${{ inputs.baseline }}
        WEBSEC_INPUT_REQUIRE_COMPLETE: ${{ inputs.require-complete }}
        WEBSEC_INPUT_SCANNERS: ${{ inputs.scanners }}
      run: python -I "$WEBSEC_ACTION_PATH/scripts/run-action.py"

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif_file != '' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_file }}
        category: websec-validator
