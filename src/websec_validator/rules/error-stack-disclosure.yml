rules:
  - id: error-stack-in-http-response
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Error stack/message returned in an HTTP response. This leaks internal file paths,
      dependency versions and code structure to clients, aiding further attacks. Return a
      generic message to the client and log the detail server-side. (REF-PENTEST #7.)
    metadata:
      cwe: "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/209.html
    patterns:
      - pattern-either:
          - pattern: $RES.send(<... $E.stack ...>)
          - pattern: $RES.json(<... $E.stack ...>)
          - pattern: $RES.status(...).send(<... $E.stack ...>)
          - pattern: $RES.status(...).json(<... $E.stack ...>)
