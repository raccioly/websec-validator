rules:
  - id: insecure-default-signing-secret
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Hard-coded fallback signing secret on an env var (e.g. `JWT_SECRET || 'dev-secret'`).
      If this fallback is ever reached at runtime, anyone who can read the source can forge
      tokens for any user/role. Remove the literal default and fail closed when the secret
      env var is unset. (PTREQ0013000 #8 — forgeable JWT.)
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    patterns:
      - pattern-either:
          - pattern: process.env.$VAR || "..."
          - pattern: process.env.$VAR ?? "..."
          - pattern: process.env[$VAR] || "..."
          - pattern: process.env[$VAR] ?? "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(SECRET|SIGNING|JWT|TOKEN|HMAC|PRIVATE_?KEY|SESSION|COOKIE).*
