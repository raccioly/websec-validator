[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-validator"
version = "0.12.0"
description = "Defensive, local-first security recon that briefs your AI coding agent on your own codebase — read-only by default (code in, artifacts out): facts + tailored probe scripts, no LLM, no server, no running app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ricardo Accioly" }]
keywords = ["security", "pentest", "sast", "dast", "bola", "ai-agent", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# v1 deliberately has ZERO runtime dependencies — stdlib only.
# It SHELLS OUT to scanners (trivy/gitleaks/semgrep/...) when present; it does not import them.
dependencies = []

[project.urls]
Homepage = "https://github.com/raccioly/websec-validator"
Repository = "https://github.com/raccioly/websec-validator"
Documentation = "https://github.com/raccioly/websec-validator/blob/main/docs/METHODOLOGY.md"
Changelog = "https://github.com/raccioly/websec-validator/blob/main/CHANGELOG.md"
Issues = "https://github.com/raccioly/websec-validator/issues"

[project.scripts]
websec = "websec_validator.cli:main"
websec-mcp = "websec_validator.mcp_server:serve"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
websec_validator = ["templates/probes/*", "templates/reports/*", "rules/*.yml", "corpus.json", "calibration.json", "schemas/*.json"]
