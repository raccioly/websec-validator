name: Documentation
description: Something in the docs is wrong, missing, unclear, or out of date — including translations.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page (or file path), e.g. docs/guides/existing-projects.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Wrong — the docs disagree with what the tool does
        - Missing — a task, flag, language or integration is not documented
        - Unclear — the steps are hard to follow
        - Translation — out of date or incorrect (name the language)
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
      description: What the page says, what actually happens (command + output if relevant), and what you expected. Include `websec --version`.
    validations:
      required: true
