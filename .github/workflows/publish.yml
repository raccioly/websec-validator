name: Publish to PyPI

# Publishes on a version tag (e.g. v0.2.0). Uses PyPI Trusted Publishing (OIDC) —
# no API token is stored in the repo. One-time setup on PyPI: add a trusted
# publisher for owner=raccioly, repo=websec-validator, workflow=publish.yml,
# environment=pypi. See the "Releasing" section in README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG  pyproject=$VER"
          [ "$TAG" = "$VER" ] || { echo "::error::tag v$TAG does not match pyproject version $VER — bump pyproject.toml before tagging"; exit 1; }

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the built artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Smoke-test the built wheel before publishing
        # Install the actual wheel and prove it works — catches a version that doesn't
        # match pyproject (the 0.2.0→reported-0.1.0 bug), a missing data file, or a broken
        # run, so a bad build fails CI instead of reaching PyPI (no yank needed afterward).
        run: |
          python -m pip install dist/*.whl
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          GOT="$(websec --version | awk '{print $NF}')"
          echo "pyproject=$VER  installed reports=$GOT"
          [ "$VER" = "$GOT" ] || { echo "::error::built wheel reports $GOT but pyproject is $VER"; exit 1; }
          python -c "from importlib import resources; assert resources.files('websec_validator').joinpath('calibration.json').is_file(), 'calibration.json missing from wheel'"
          websec run tests/fixtures/py_app --out "$RUNNER_TEMP/smoke"
          test -f "$RUNNER_TEMP/smoke/latest/AGENT-BRIEFING.md" || { echo "::error::websec run produced no AGENT-BRIEFING.md"; exit 1; }
          echo "wheel installs, reports $GOT, ships calibration, and runs ✓"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24; v5/v6 were still node20)
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # configure this environment name in the PyPI trusted publisher
    permissions:
      id-token: write          # OIDC — this is what authenticates to PyPI, no token needed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24; v5 was node20)
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
