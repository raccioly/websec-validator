name: Release train (tag and publish)

# Fires when a `release: vX.Y.Z` commit lands on the default branch — i.e. when the weekly release
# PR is merged. Creates the tag and then explicitly dispatches the publish workflow.
#
# Why the explicit dispatch: a tag pushed with GITHUB_TOKEN does not trigger `on: push: tags`, by
# GitHub's recursion guard. workflow_dispatch and repository_dispatch are the two events exempt from
# it, so dispatching publish.yml at the new tag is the supported way across that boundary.
#
# Keyed on the commit SUBJECT, never on "pyproject version != latest tag". A version bumped by hand,
# or one already sitting un-tagged in the tree, must not trigger a publish to PyPI.
on:
  push:
    branches: [main]

permissions:
  contents: write             # create and push the tag
  actions: write              # dispatch publish.yml

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Confirm this really is a release commit
        id: check
        run: |
          set -euo pipefail
          python .github/scripts/release.py tag-version | tee "$RUNNER_TEMP/tag.txt"
          grep -E '^[a-z_]+=' "$RUNNER_TEMP/tag.txt" >> "$GITHUB_OUTPUT" || true

      - name: Tag and dispatch the publish workflow
        if: steps.check.outputs.should_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          echo "tagged v$VERSION"

          # publish.yml re-verifies tag == pyproject version and smoke-tests the built wheel before
          # it uploads, so the tag ref is what must be dispatched.
          gh workflow run publish.yml --ref "v$VERSION"
          echo "dispatched publish.yml at v$VERSION"

      - name: Publish the GitHub Release
        if: steps.check.outputs.should_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        # Tagging alone leaves the Releases page stale — v0.11.0 was tagged and shipped to PyPI
        # without one, breaking an otherwise unbroken run. Notes are lifted from the changelog
        # section for this version so the two never drift.
        run: |
          set -euo pipefail
          python - "$VERSION" > "$RUNNER_TEMP/notes.md" <<'EOF'
          import sys
          from pathlib import Path
          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text().split("\n")
          start = next((i for i, l in enumerate(lines) if l.startswith(f"## [{version}]")), None)
          if start is None:
              print(f"Release {version}.")
          else:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")), len(lines))
              print("\n".join(lines[start + 1:end]).strip())
          EOF
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          echo "published GitHub Release v$VERSION"
