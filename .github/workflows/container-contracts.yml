name: Container contracts

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/install-container-scanners.sh
      - .github/workflows/container-contracts.yml
      - src/**
      - pyproject.toml
      - README.md
      - tests/test_container_contracts.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: container (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, target: core}
          - {runner: ubuntu-24.04-arm, arch: arm64, target: core}
          - {runner: ubuntu-24.04, arch: amd64, target: bundled}
          - {runner: ubuntu-24.04-arm, arch: arm64, target: bundled}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build reviewed engine image (never an untrusted target installer)
        env:
          IMAGE_TARGET: ${{ matrix.target }}
        run: docker build --target "$IMAGE_TARGET" --tag websec-contract .
      - name: Retain immutable local image identity and run offline core contract
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker image inspect websec-contract --format '{{.Id}} {{.Architecture}} {{.Config.User}} {{json .Config.Healthcheck}}'
          test "$(docker image inspect websec-contract --format '{{.Architecture}}')" = "$IMAGE_ARCH"
          docker run --rm --network none --entrypoint python websec-contract -c 'import importlib.metadata as m,os; assert os.getuid()!=0; assert not m.requires("websec-validator"); print(m.version("websec-validator"))'
          docker run --rm --network none websec-contract --help
          # Owned disposable fixture is data only; no pip/npm/target execution.
          docker run --rm --network none --entrypoint python websec-contract -c 'import pathlib,tempfile,subprocess,json; t=tempfile.TemporaryDirectory(); p=pathlib.Path(t.name); r=p/"target"; r.mkdir(); (r/"app.py").write_text("raise RuntimeError(\"never execute target\")\n"); out=p/"out"; result=subprocess.run(["websec","run",str(r),"--out",str(out),"--format","json","--require-complete"],capture_output=True,text=True); assert result.returncode==0,result.stderr; envelope=json.loads(result.stdout); facts=json.loads((out/"runs"/envelope["generated"]/"FACTS.json").read_text()); assert facts["coverage"]["execution_complete"]; print("offline source-only fixture passed")'
      - name: Execute bundled scanner version contracts
        if: matrix.target == 'bundled'
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint noir websec-contract --version
          docker run --rm --network none --entrypoint gitleaks websec-contract version
          docker run --rm --network none --entrypoint trivy websec-contract --version
          docker run --rm --network none --entrypoint semgrep websec-contract --version
          docker run --rm --network none --entrypoint checkov websec-contract --version
