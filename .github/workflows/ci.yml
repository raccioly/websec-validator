name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets the release workflow dispatch CI against a bot-opened branch,
                            # which GITHUB_TOKEN-created PRs never trigger on their own.

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (stdlib-only — validates packaging too)
        run: python -m pip install -e .

      - name: Byte-compile (syntax smoke test across the package)
        run: python -m compileall -q src

      - name: CLI entrypoint smoke test
        run: websec --help

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  hermeticity:
    # bug-217: the suite was not hermetic against ambient git config. A global core.hooksPath
    # redirected every hook install in test_hooks out of the temp repo — silently, while the
    # assertions still passed — and commit.gpgsign broke test_diffscope's commits outright. Bare
    # GitHub runners have no global git config, so plain CI can never see this class of defect;
    # agent sandboxes and Husky users hit it constantly. This leg manufactures that environment.
    name: hermeticity (hostile git config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - name: Build a hostile global git config + sentinel hooks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/globalhooks"
          # post-commit holds ONLY a shebang: that is the shape hooks.uninstall() deletes outright
          # once our marker block is stripped, so it detects the destructive path.
          printf '#!/bin/sh\n' > "$RUNNER_TEMP/globalhooks/post-commit"
          # pre-push carries foreign content: uninstall must preserve it byte-for-byte.
          printf '#!/bin/sh\necho SENTINEL\n' > "$RUNNER_TEMP/globalhooks/pre-push"
          chmod +x "$RUNNER_TEMP/globalhooks/"*
          ( cd "$RUNNER_TEMP/globalhooks" && md5sum -- * > "$RUNNER_TEMP/hooks.md5" )
          cat "$RUNNER_TEMP/hooks.md5"
          cfg="$RUNNER_TEMP/gitconfig-hostile"
          git config --file "$cfg" core.hooksPath "$RUNNER_TEMP/globalhooks"
          git config --file "$cfg" core.autocrlf true
          git config --file "$cfg" commit.gpgsign true
          git config --file "$cfg" init.defaultBranch trunk
          cat "$cfg"

      - name: Suite must pass under that config
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig-hostile
        run: python -m unittest discover -s tests

      - name: Sentinel hooks must be untouched (suite must not write outside its temp repos)
        # A write that is later perfectly reverted is undetectable this way; the step above is the
        # primary signal. This catches the residue: a deleted hook, a modified one, or a stray file.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/globalhooks"
          if ! md5sum -c "$RUNNER_TEMP/hooks.md5"; then
            echo "::error::the test suite altered or deleted a git hook outside its own temp repo"
            ls -la; exit 1
          fi
          extra=$(ls -1 | grep -vxE 'post-commit|pre-push' || true)
          if [ -n "$extra" ]; then
            echo "::error::the test suite created files in the global hooks dir: $extra"; exit 1
          fi
          echo "sentinel hooks intact"

  suite-integrity:
    # Guards the "green but wrong" failure mode that matters for a scanner: a change that makes CI
    # pass by REMOVING coverage. A deleted or neutered test makes the suite greener AND faster, so
    # neither a pass/fail signal nor a runtime ceiling catches it — only a floor does. Raising the
    # floor means editing this workflow, which is a human-reviewed path.
    name: suite-integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # reads this run's own job names to validate required-checks.json
    env:
      MIN_TESTS: 1154          # bump when adding tests; never lower it to make a PR pass
      # The suite runs in ~10s on CI. 300s would have been 30x nominal and useless: the known
      # failure in this class (docguard PR #328 — a test given "/" as its project dir walked the
      # whole filesystem) was a 7.6x blowup that stayed GREEN throughout, and 7.6x of 10s still
      # fits under 300s. 60s is 6x nominal, which catches that shape while tolerating a 3x slow
      # runner. Loose enough for jitter, tight enough to mean something.
      MAX_SECONDS: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - name: Classifier unit tests (the logic that merges PRs without a human)
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Required-check names must match the jobs this run actually emits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/verify_required_checks.py

      - name: Count tests and enforce the floor
        run: |
          set -euo pipefail
          # No pipe on purpose — a pipeline reports the exit code of its LAST stage and would mask
          # a suite failure here.
          start=$(date +%s)
          rc=0
          python -m unittest discover -s tests > "$RUNNER_TEMP/suite.log" 2>&1 || rc=$?
          elapsed=$(( $(date +%s) - start ))
          tail -5 "$RUNNER_TEMP/suite.log"
          if [ "$rc" -ne 0 ]; then echo "::error::test suite failed"; exit "$rc"; fi

          # awk, not `sed -n 's/...tests\?.../'` — `\?` is a GNU extension, so that form works on the
          # runner while being unverifiable on a BSD-sed machine.
          count=$(awk '/^Ran [0-9]+ tests? in /{n=$2} END{print n}' "$RUNNER_TEMP/suite.log")
          if [ -z "$count" ]; then
            echo "::error::could not parse the test count from unittest output"; exit 1
          fi
          echo "collected $count tests in ${elapsed}s (floor $MIN_TESTS, ceiling ${MAX_SECONDS}s)"

          if [ "$count" -lt "$MIN_TESTS" ]; then
            echo "::error::test count $count is below the floor $MIN_TESTS — coverage was removed."
            echo "::error::Restore missing tests or investigate test collection; never lower MIN_TESTS to make this pass."
            exit 1
          fi
          if [ "$elapsed" -gt "$MAX_SECONDS" ]; then
            echo "::error::suite took ${elapsed}s (> ${MAX_SECONDS}s) — likely a test blocking on the network"
            exit 1
          fi
