name: Adoption contracts

on:
  pull_request:
    paths:
      - src/**
      - pyproject.toml
      - action.yml
      - scripts/run-action.py
      - scripts/create-adoption-target.py
      - .pre-commit-hooks.yaml
      - tests/test_precommit_lifecycle.py
      - tests/test_adoption_checkout.py
      - .github/workflows/adoption-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precommit:
    name: pre-commit lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Development-only framework installation on disposable runner
        run: python -m pip install pre-commit==4.6.2
      - name: Execute owned install/staged/manual/pre-push/foreign-hook lifecycle
        env:
          WEBSEC_VALIDATE_PRECOMMIT: '1'
          PYTHONPATH: src:tests
        run: python -m unittest test_precommit_lifecycle -v

  separate-engine:
    name: separate engine (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [clean, unsafe, incomplete]
    steps:
      - name: Check out reviewed development engine, not target Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .websec-engine
          persist-credentials: false
          submodules: false
      - name: Create and clone owned inert target at an exact Git commit
        id: target
        env:
          CASE: ${{ matrix.case }}
        run: python3 -I .websec-engine/scripts/create-adoption-target.py --case "$CASE" --owner "$RUNNER_TEMP"
      - name: Review target through separate engine Action
        id: audit
        continue-on-error: true
        uses: ./.websec-engine
        with:
          path: ${{ steps.target.outputs.target }}
          out: ${{ runner.temp }}/websec-owned-action
          scan: 'false'
          require-complete: 'true'
          fail-on: high
          upload-sarif: 'false'
      - name: Verify actual current-attempt outcomes and no target execution
        env:
          CASE: ${{ matrix.case }}
          OUTCOME: ${{ steps.audit.outcome }}
          CURRENT_RUN: ${{ steps.audit.outputs.run-directory }}
          TARGET: ${{ steps.target.outputs.target }}
          TARGET_COMMIT: ${{ steps.target.outputs.commit }}
          TARGET_MARKER: ${{ steps.target.outputs.marker }}
        run: |
          python3 -I - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          case=os.environ['CASE']
          assert os.environ['OUTCOME']==('success' if case=='clean' else 'failure'),os.environ['OUTCOME']
          assert not Path(os.environ['TARGET_MARKER']).exists()
          env={k:v for k,v in os.environ.items() if not k.startswith('GIT_')}
          env.update(GIT_CONFIG_GLOBAL=os.devnull,GIT_CONFIG_NOSYSTEM='1')
          def git(*args):
              return subprocess.run(['git','-c','core.hooksPath='+os.devnull,'-c','core.fsmonitor=false',
                  '-C',os.environ['TARGET'],*args],env=env,capture_output=True,text=True,check=True).stdout.strip()
          assert git('rev-parse','HEAD')==os.environ['TARGET_COMMIT']
          assert git('status','--porcelain')=='', 'target source was mutated'
          assert os.environ['CURRENT_RUN'], 'no current artifact output'
          run=Path(os.environ['CURRENT_RUN'])
          facts=json.loads((run/'FACTS.json').read_text())
          assert facts['coverage']['execution_complete']==(case!='incomplete')
          ledger=json.loads((run/'findings-ledger.json').read_text())
          if case=='unsafe':
              assert any(row['attack_class']=='weak-password-hash' for row in ledger['findings'])
          print('separate engine contract passed:',case,run.name)
          PY
